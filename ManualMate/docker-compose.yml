services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: manualmate-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ManualMate}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-05052004}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ManualMate}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: manualmate-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ManualMate.API/Dockerfile
    container_name: manualmate-api
    restart: always
    ports:
      - "5035:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ManualMateDbContext: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ManualMate};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-05052004}"
      ConnectionStrings__Redis: "redis:6379"
      VoyageAI__ApiToken: "${VOYAGEAI_API_TOKEN}"
      Gemini__GeminiToken: "${GEMINI_API_TOKEN}"
    volumes:
      - upload_data:/app/wwwroot/Files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: manualmate-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  upload_data:
